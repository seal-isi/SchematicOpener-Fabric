name: Build JAR
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Arrange sources
        run: |
          mkdir -p src/main/java/com/example/schematiicopener src/main/resources/assets/schematiicopener/lang
          cp SchematicOpenerClient.java KeyHandler.java ScreenHandler.java FileOpener.java src/main/java/com/example/schematiicopener/
          cp fabric.mod.json src/main/resources/
          cp en_us.json src/main/resources/assets/schematiicopener/lang/
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: SchematicOpener-1.0.0
          path: build/libs/SchematicOpener-1.0.0.jar
